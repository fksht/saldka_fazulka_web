<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Sladká fazuľka — ručne pečené candy bary, mini zákusky, fazuľkové špeciality a torty na mieru. Košice. Nezáväzná objednávka a galéria prác."
  />
  <meta property="og:title" content="Sladká fazuľka — candy bary, zákusky a torty na mieru" />
  <meta
    property="og:description"
    content="Domáca cukrárska dielňa v Košiciach. Mini zákusky, fazuľkové špeciality, candy bar balíčky pre 20 – 150 hostí, svadobné výslužky a torty na mieru."
  />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="sk_SK" />
  <meta name="theme-color" content="#442e28" />
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <title>Sladká fazuľka | Candy bary, zákusky a torty na mieru</title>
  <script>
    (function (locationRef) {
      if (locationRef.search[1] === '/') {
        var decoded = locationRef.search
          .slice(1)
          .split('&')
          .map(function (value) {
            return value.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(null, null, locationRef.pathname.slice(0, -1) + decoded + locationRef.hash);
      }
    })(window.location);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
